---
# Installs Docker Engine + Compose plugin on Debian from Docker's official apt repository.
# Put the target machine(s) in an inventory group called "docker", or change "hosts" below.

- name: Install Docker on Debian
  hosts: docker
  become: true

  vars:
    docker_users: []            # users to add to the docker group, e.g. ["harry"]
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf

  tasks:
    - name: Remove conflicting distro packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-doc
          - podman-docker
          - containerd
          - runc
        state: absent

    - name: Check for a classic sources.list
      ansible.builtin.stat:
        path: /etc/apt/sources.list
      register: sources_list

    - name: Disable the install-disc (cdrom) apt source
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: '^(deb\s+cdrom:.*)$'
        replace: '# \1'
      when: sources_list.stat.exists

    - name: Make sure Debian's online repositories are configured
      ansible.builtin.deb822_repository:
        name: debian-online
        types: deb
        uris: http://deb.debian.org/debian
        suites:
          - "{{ ansible_facts['distribution_release'] }}"
          - "{{ ansible_facts['distribution_release'] }}-updates"
        components: main
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present

    - name: Make sure Debian's security repository is configured
      ansible.builtin.deb822_repository:
        name: debian-security-online
        types: deb
        uris: http://security.debian.org/debian-security
        suites: "{{ ansible_facts['distribution_release'] }}-security"
        components: main
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker's GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker's apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/debian
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: "{{ docker_arch_map[ansible_facts['architecture']] }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
      register: docker_repo

    - name: Install Docker Engine, CLI, containerd, buildx and compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: "{{ docker_repo.changed }}"

    - name: Start Docker and enable it at boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add users to the docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"

    - name: Check Docker and Compose versions
      ansible.builtin.command: "{{ item }}"
      loop:
        - docker --version
        - docker compose version
      register: versions
      changed_when: false

    - name: Show versions
      ansible.builtin.debug:
        msg: "{{ versions.results | map(attribute='stdout') | list }}"
