---
# Simple rolling dist-upgrade for a Proxmox cluster: one node at a time, no reboots, no HA handling.
#
# Usage:
#   ansible-playbook -i inventory.ini proxmox-update-simple.yml --limit prox08   # test on one node
#   ansible-playbook -i inventory.ini proxmox-update-simple.yml                  # whole cluster

- name: Rolling dist-upgrade of Proxmox nodes
  hosts: proxmox
  become: true
  serial: 1
  any_errors_fatal: true

  tasks:
    - name: Update package index and dist-upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        dpkg_options: force-confold,force-confdef

    - name: Check the node is still healthy
      ansible.builtin.command: systemctl is-active pve-cluster corosync pvedaemon pveproxy
      changed_when: false
