---
- name: Rolling dist-upgrade of Proxmox nodes
  hosts: proxmox
  become: true
  serial: 5                     # nodes upgraded at the same time (set to 1 for strictly one-by-one)
  gather_facts: false           # not needed, and avoids a slow failure on dead hosts
  vars:
    ansible_ssh_pipelining: true   # fewer SSH round-trips per task
  ignore_unreachable: true      # a dead host is skipped instead of stalling the run

  tasks:
    - name: Is this host part of a cluster?
      ansible.builtin.command: pvecm status
      register: cluster_check
      changed_when: false
      failed_when: false

    - name: Skip hosts that are unreachable or not in a cluster
      ansible.builtin.debug:
        msg: "Skipping - unreachable or not part of a Proxmox cluster"
      when: cluster_check.rc | default(1) != 0

    - ansible.builtin.meta: end_host
      when: cluster_check.rc | default(1) != 0

    - name: apt update
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600      # skip if the package lists were refreshed in the last hour

    - name: apt dist-upgrade
      ansible.builtin.apt:
        upgrade: dist
        dpkg_options: force-confold,force-confdef
        lock_timeout: 120
      register: upgrade_result

    - name: Packages upgraded
      ansible.builtin.debug:
        msg: "{{ upgrade_result.stdout_lines | select('match', '^Unpacking') | list }}"
      when: upgrade_result.changed

    - name: Proxmox version
      ansible.builtin.command: pveversion
      register: pvever
      changed_when: false

    - name: Show version
      ansible.builtin.debug:
        msg: "{{ pvever.stdout }}"
